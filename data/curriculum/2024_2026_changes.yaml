# 单词量 71→114, 涨幅 60%, 难度大涨
# ============================================

- grade: 3
  subject: english
  version: 人教PEP版
  semester: 2025-spring
  verified: true
  source: 搜狐《2025春学期1-6年级(下册)新教材变动情况汇总》2025-02
  source_url: https://www.sohu.com/a/858660594_121124330
  changes:
    - chapter: 三年级下册(整体)
      type: adjusted
      summary: 新教材全面调整, 单元主题基本全部改变, 图片为真实场景
      key_points:
        - 单词量 71→114, 涨幅近 60%
        - 难度提升, 出现高年级单词 (smell, taste 等)
