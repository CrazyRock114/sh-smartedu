        - 阅读量增大
        - 阅读内容更丰富 (数学、环保、地理、科普)
        - 跨文化板块和生活实践结合

# ============================================
# 一年级语文 (统编版) - 2025 春改版
# ============================================

- grade: 1
  subject: chinese
  version: 统编版
  semester: 2025-spring
  verified: true
  source: 搜狐 + 今日头条 2025-01
  source_url: https://www.sohu.com/a/858660594_121124330
  changes:
    - chapter: 一年级下册(整体)
      type: adjusted
      summary: 单元名称"课文"改为"阅读", 识字量增加
      key_points:
        - 单元名称: "课文" → "阅读"
        - 识字表: 400 → 410 字 (约 1/4 与旧版不同)
        - 写字表: 仍是 200 字, 但约 1/3 与旧版不同
        - 常用偏旁: 29 → 38 个
        - 删除《四个太阳》《彩虹》新增《热爱中国共产党》《浪花》
        - 口语交际并入语文园地
        - 整体向"阅读能力"倾斜, 不再单纯识字

# ============================================
# 五年级数学 - 2026 秋预期改版
# 把原本六年级的"数的整除""分数"下移到五年级
# ⚠️ 此为腾讯/今日头条 2026-01 报道, 单一来源, 需开学后核实
# ============================================

- grade: 5
  subject: math
  version: 沪教版
  semester: 2026-fall
  verified: false
  source: 腾讯/今日头条 2026-01《2026上海秋季新教材全面换血》
  source_url: 待补充
  changes:
    - chapter: 五年级上(整体)
      type: adjusted
      summary: 原六年级"数的整除"和"分数"内容下移到五年级
      key_points:
        - 数的整除 (因数、倍数、质数、合数、最大公因数、最小公倍数) 移到五年级
        - 分数 (意义、性质、加减乘除) 重新集中安排在五年级
        - 原本五年级方程内容移到六年级
        - 难度上浮, 知识体系重新组装
        - 增加综合实践任务 (旅行方案设计等)
    - chapter: 三年级上
      type: adjusted
      summary: 新增"倍"和周长的认识前置
      key_points:
        - "倍"前置到三年级上
        - 周长前置, 面积后移
        - 知识衔接性更强, 但跨度增加

