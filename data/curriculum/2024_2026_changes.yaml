# ============================================
# 总体方向性说明
# ============================================
# 2024 秋 - 小学 1 年级、初中 7 年级启用新教材
# 2025 秋 - 覆盖小学 1-3 年级、初中 6-7 年级 + 全部学科
# 2026 秋 9 月 - 上海所有年级全学科启用新教材 (三年改版收官)
# 整体方向: 从"知识灌输"到"能力塑造", 跨学科融合, 素养导向

general:
  2024_to_2026_overview:
    direction: 从"知识灌输"到"能力塑造", 跨学科融合, 素养导向
    key_principles:
      - 知识前移 (中高年级能力要求加码)
      - 跨学科主题学习 (占比 ≥ 10%)
      - 实践探究 (综合实践任务增加)
      - 思辨能力 (阅读要求"读出言外之意")
      - 文化自信 (古诗文 130→160 篇)
    parents_key_questions:
      - 我家孩子用新教材还是旧教材?
      - 这学期哪些章节是改版重点?
      - 孩子需要补什么?
      - 家长需要做什么配合?
